<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dogfight Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1a2a48;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
  #menuBtn{position:fixed;left:16px;top:16px;padding:8px 14px;border-radius:10px;background:rgba(0,12,30,.6);color:#ffb86a;font:900 12px Orbitron,sans-serif;text-decoration:none;border:1px solid rgba(255,184,106,.5);letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="menuBtn" href="index.html">◀ MENU</a>
<script>
'use strict';
// ================= 유틸 =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const pick = a => a[Math.floor(Math.random() * a.length)];
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInCubic = x => x * x * x;
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const FONT = "Orbitron, 'Arial Black', sans-serif";
const KFONT = "'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function hash(ix, iy, s) { const h = Math.sin(ix * 127.1 + iy * 311.7 + s * 74.7) * 43758.5453; return h - Math.floor(h); }

const btn = { msl: { x: 0, y: 0, r: 36, c: '#ffb86a', l: 'MSL' }, flr: { x: 0, y: 0, r: 30, c: '#ff6ad0', l: 'FLARE' }, bst: { x: 0, y: 0, r: 30, c: '#6ae0ff', l: 'BOOST' } };
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  btn.msl.x = W - 64; btn.msl.y = H - 74; btn.flr.x = W - 64; btn.flr.y = H - 166; btn.bst.x = W - 156; btn.bst.y = H - 74;
}

// ================= 글로우 =================
const glowCache = {};
function glowSpr(col) {
  let c = glowCache[col]; if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, hexA(col, 1)); gr.addColorStop(.25, hexA(col, .6)); gr.addColorStop(.6, hexA(col, .15)); gr.addColorStop(1, hexA(col, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return glowCache[col] = c;
}
function glow(x, y, r, col, a = 1) { if (a <= 0) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(glowSpr(col), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; }

// ================= 사운드 =================
let AC = null, master = null, noiseBuf = null; const lastS = {};
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { }
}
function can(n, gap) { const now = performance.now(); if (lastS[n] && now - lastS[n] < gap) return false; lastS[n] = now; return true; }
function tone(f, d, type = 'square', v = .05, slide = 1, delay = 0) {
  if (!AC) return; const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + .02);
}
function noise(d, v = .2, f = 1000, f2 = 100) {
  if (!AC) return; const t0 = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const bq = AC.createBiquadFilter(); bq.type = 'lowpass'; bq.frequency.setValueAtTime(f, t0); bq.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t0 + d);
  const g = AC.createGain(); g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  s.connect(bq); bq.connect(g); g.connect(master); s.start(t0); s.stop(t0 + d);
}
const sfx = {
  gun() { if (can('gun', 70)) { noise(.05, .05, 3000, 800); } },
  egun() { if (can('egun', 90)) tone(500, .04, 'square', .012, .5); },
  hit() { if (can('hit', 55)) noise(.06, .06, 4500, 1500); },
  boom(s = 1) { if (can('boom', 45)) { noise(.35 + s * .25, Math.min(.5, .16 * s + .1), 1500, 60); tone(110, .3 + .2 * s, 'sine', .14 * Math.min(s, 2), .3); } },
  big() { noise(1.6, .55, 1000, 40); tone(70, 1.3, 'sine', .38, .3); },
  launch() { noise(.5, .14, 5000, 400); tone(300, .4, 'sawtooth', .03, 3); },
  lock() { tone(1400, .06, 'square', .03); },
  locked() { tone(1800, .15, 'square', .04); },
  alert() { if (can('alert', 280)) { tone(950, .1, 'square', .05); tone(700, .1, 'square', .05, 1, .12); } },
  flare() { noise(.4, .12, 6000, 1500); },
  hurt() { noise(.3, .3, 2500, 200); tone(220, .25, 'sawtooth', .08, .4); },
  boost() { noise(.6, .12, 300, 3000); },
  wave() { tone(440, .12, 'triangle', .06); tone(660, .12, 'triangle', .06, 1, .12); tone(880, .3, 'triangle', .06, 1, .24); },
  pick() { tone(700, .08, 'square', .04, 1.5); tone(1050, .14, 'square', .04, 1.5, .07); },
};

// ================= 상태 =================
let state = 'title', t = 0, titleT = 0, paused = false;
let timeScale = 1, slowmo = 0, hitstop = 0, shake = 0, flash = 0, flashCol = '#fff', hurtFlash = 0, zoomPunch = 0;
const cam = { x: 0, y: 0, z: 1 };
let player, enemies = [], bullets = [], ebullets = [], missiles = [], flares = [], parts = [], rings = [], texts = [], timers = [];
let score = 0, dispScore = 0, scorePop = 0, combo = 0, maxCombo = 0, comboT = 0, comboPop = 0, wave = 0, waveActive = false, kills = 0;
let banner = null, overT = 0, overAnim = 0, best = 0, newRecord = false, alertOn = false;
try { best = +localStorage.getItem('dogfight_best') || 0; } catch (e) { }
function later(d, fn) { timers.push({ t: d, fn }); }
function popText(x, y, txt, size = 16, col = '#fff', life = .9, vy = -60, screen = false) { texts.push({ x, y, txt, size, col, life, max: life, vy, screen }); }

// ================= 입력 =================
const keys = {};
const mouse = { x: 0, y: 0, active: false, lastMove: 0 };
const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
let isTouch = false, touchBoost = null;
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true; if (e.repeat) return; initAudio();
  if (['KeyA', 'KeyD', 'KeyW', 'KeyS', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) mouse.active = false;
  if (e.code === 'KeyM' && (state !== 'play' || paused)) { location.href = 'index.html'; return; }
  if (state === 'title' || (state === 'over' && overAnim > 1)) { if (e.code === 'Space' || e.code === 'Enter') startGame(); return; }
  if (state === 'play') {
    if (e.code === 'Space' || e.code === 'KeyJ') fireMissile();
    if (e.code === 'KeyF' || e.code === 'KeyE' || e.code === 'KeyK') dropFlares();
    if (e.code === 'KeyP' || e.code === 'Escape') paused = !paused;
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play' && player.alive) paused = true; });
cv.addEventListener('contextmenu', e => { e.preventDefault(); if (state === 'play') dropFlares(); });
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; if (state === 'play') mouse.active = true; }
  if (e.pointerId === stick.id) { stick.x = e.clientX; stick.y = e.clientY; }
});
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (e.pointerType === 'touch') isTouch = true;
  if (state === 'title' || (state === 'over' && overAnim > 1)) { startGame(); return; }
  if (state !== 'play') return;
  if (paused) { paused = false; return; }
  if (e.pointerType === 'mouse') { mouse.active = true; mouse.x = e.clientX; mouse.y = e.clientY; if (e.button === 0) fireMissile(); return; }
  for (const k of ['msl', 'flr', 'bst']) {
    const b = btn[k]; if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r + 12) {
      if (k === 'msl') fireMissile(); else if (k === 'flr') dropFlares(); else touchBoost = e.pointerId;
      return;
    }
  }
  stick.id = e.pointerId; stick.ox = stick.x = e.clientX; stick.oy = stick.y = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
});
const endPtr = e => { if (e.pointerId === stick.id) stick.id = null; if (e.pointerId === touchBoost) touchBoost = null; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);

// ================= 배경 =================
let cloudSprs = [], islandSprs = [];
function makeCloud(w) {
  const h = Math.round(w * .62), mk = col => {
    const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
    for (let i = 0; i < 16; i++) {
      const x = rand(.22, .78) * w, y = rand(.32, .68) * h, r = rand(.12, .22) * w;
      const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col(.95)); gr.addColorStop(.6, col(.5)); gr.addColorStop(1, col(0));
      g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    return c;
  };
  return { white: mk(a => `rgba(255,246,236,${a})`), dark: mk(a => `rgba(30,20,60,${a})`), w, h };
}
function makeIsland(size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), cx = size / 2, R = size * .3;
  const seed = [[2, rand(0, TAU), .16], [3, rand(0, TAU), .11], [5, rand(0, TAU), .06], [9, rand(0, TAU), .03]];
  const blob = r => { g.beginPath(); for (let i = 0; i <= 72; i++) { const a = i / 72 * TAU; let k = 1; for (const [f, ph, am] of seed) k += Math.sin(a * f + ph) * am; const x = cx + Math.cos(a) * r * k, y = cx + Math.sin(a) * r * k; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.closePath(); };
  g.fillStyle = 'rgba(120,200,210,.35)'; blob(R * 1.15); g.fill();
  g.fillStyle = '#d8c79a'; blob(R); g.fill();
  g.fillStyle = '#4c8a48'; blob(R * .85); g.fill();
  for (let i = 0; i < 40; i++) { const a = rand(0, TAU), d = Math.sqrt(Math.random()) * R * .65; g.fillStyle = pick(['#2f6f30', '#3d8a3b', '#5aa850']); g.beginPath(); g.arc(cx + Math.cos(a) * d, cx + Math.sin(a) * d, rand(3, 9) * size / 300, 0, TAU); g.fill(); }
  return c;
}
function initBG() {
  cloudSprs = Array.from({ length: 5 }, () => makeCloud(ri(260, 400)));
  islandSprs = Array.from({ length: 4 }, () => makeIsland(ri(240, 360)));
}
function drawLayer(f, cell, chance, seed, scl, alpha, sprFn) {
  const z = cam.z * (0.55 + f * .45), cx = cam.x * f, cy = cam.y * f, hw = W / 2 / z, hh = H / 2 / z, pad = cell;
  const x0 = Math.floor((cx - hw - pad) / cell), x1 = Math.floor((cx + hw) / cell), y0 = Math.floor((cy - hh - pad) / cell), y1 = Math.floor((cy + hh) / cell);
  ctx.globalAlpha = alpha;
  for (let ix = x0; ix <= x1; ix++) for (let iy = y0; iy <= y1; iy++) {
    if (hash(ix, iy, seed) > chance) continue;
    const spr = sprFn(hash(ix, iy, seed + 1)), s = scl * (.7 + hash(ix, iy, seed + 3) * .6);
    const wx = ix * cell + hash(ix, iy, seed + 2) * cell * .5, wy = iy * cell + hash(ix, iy, seed + 4) * cell * .5;
    ctx.drawImage(spr, W / 2 + (wx - cx) * z, H / 2 + (wy - cy) * z, spr.width * s * z, spr.height * s * z);
  }
  ctx.globalAlpha = 1;
}
function drawBG() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#1b3a66'); g.addColorStop(.6, '#245485'); g.addColorStop(1, '#2d6aa0');
  ctx.fillStyle = g; ctx.fillRect(-60, -60, W + 120, H + 120);
  drawLayer(.18, 900, .35, 11, 1, .9, h => islandSprs[Math.floor(h * islandSprs.length)]);
  // 석양 빛 오버레이
  const sg = ctx.createRadialGradient(W * .85, -H * .2, 0, W * .85, -H * .2, Math.max(W, H) * 1.1);
  sg.addColorStop(0, 'rgba(255,170,90,.45)'); sg.addColorStop(.5, 'rgba(255,120,90,.12)'); sg.addColorStop(1, 'rgba(255,120,90,0)');
  ctx.fillStyle = sg; ctx.fillRect(-60, -60, W + 120, H + 120);
  drawLayer(.45, 520, .55, 23, 1.2, .38, h => cloudSprs[Math.floor(h * cloudSprs.length)].white);
  drawLayer(.75, 460, .45, 37, 1, .5, h => cloudSprs[Math.floor(h * cloudSprs.length)].white);
}

// ================= 파티클 =================
function P(o) { if (parts.length < 2600) parts.push(o); }
function spark(x, y, a, s, col = '#ffd27a', life = .4, size = 2) { P({ k: 's', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, size, col, drag: 3 }); }
function fireP(x, y, vx, vy, size, life) { P({ k: 'f', x, y, vx, vy, life, max: life, size, drag: 2.2, grow: 1.4 }); }
function smoke(x, y, vx, vy, size, life, col = '#4a4a50') { P({ k: 'm', x, y, vx, vy, life, max: life, size, drag: 1.5, grow: 2.2, col }); }
function debris(x, y, s = 1) { const a = rand(0, TAU), sp = rand(150, 480) * s, l = rand(.6, 1.3); P({ k: 'd', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: l, max: l, size: rand(3, 8), rot: rand(0, TAU), vr: rand(-15, 15), drag: 1.2 }); }
function flashP(x, y, size, col = '#ffe6a0', life = .25) { P({ k: 'g', x, y, vx: 0, vy: 0, life, max: life, size, col, drag: 0 }); }
function explode(x, y, s = 1, vx = 0, vy = 0) {
  const q = Math.sqrt(s);
  flashP(x, y, 90 * s);
  for (let i = 0; i < Math.round(10 * s); i++) { const a = rand(0, TAU), sp = rand(20, 230) * q; fireP(x, y, Math.cos(a) * sp + vx * .4, Math.sin(a) * sp + vy * .4, rand(10, 22) * q, rand(.35, .85)); }
  for (let i = 0; i < Math.round(14 * s); i++) spark(x, y, rand(0, TAU), rand(200, 750) * q, pick(['#ffdc8a', '#ffffff', '#ffb050']), rand(.2, .55), rand(1.5, 3));
  for (let i = 0; i < Math.round(6 * s); i++) smoke(x + rand(-10, 10) * s, y + rand(-10, 10) * s, rand(-60, 60) + vx * .3, rand(-60, 60) + vy * .3, rand(12, 24) * q, rand(.8, 1.7));
  for (let i = 0; i < Math.round(3 * s); i++) debris(x, y, q);
  rings.push({ x, y, life: .45, max: .45, R: 110 * s, w: 6 * q, col: '#ffffff' });
  const d = player ? Math.hypot(x - player.x, y - player.y) : 0;
  shake = Math.max(shake, 4 * s * clamp(1.4 - d / 900, .2, 1)); sfx.boom(s);
}
function updParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life -= dt;
    if (q.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    const dr = Math.max(0, 1 - q.drag * dt); q.vx *= dr; q.vy *= dr; q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.k === 'd') { q.rot += q.vr * dt; if (Math.random() < dt * 35) { smoke(q.x, q.y, 0, 0, 4, .5); fireP(q.x, q.y, 0, 0, 5, .2); } }
  }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].life -= dt; if (rings[i].life <= 0) rings.splice(i, 1); }
  for (let i = texts.length - 1; i >= 0; i--) { const x = texts[i]; x.life -= dt; x.y += x.vy * dt; x.vy *= Math.max(0, 1 - 2 * dt); if (x.life <= 0) texts.splice(i, 1); }
}
const FIRECOL = ['#a02010', '#ff5a1a', '#ffb030', '#fff2b0'];
function drawParts() {
  for (const q of parts) if (q.k === 'm') { const f = q.life / q.max; glow(q.x, q.y, q.size * (1 + (1 - f) * q.grow) * 1.4, q.col, f * .6); }
  ctx.fillStyle = '#2a2622';
  for (const q of parts) if (q.k === 'd') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillRect(-q.size / 2, -q.size / 3, q.size, q.size * .66); ctx.restore(); }
  ctx.globalCompositeOperation = 'lighter';
  for (const q of parts) {
    const f = q.life / q.max;
    if (q.k === 'f') glow(q.x, q.y, q.size * (1 + (1 - f) * q.grow), FIRECOL[Math.min(3, Math.floor(f * 4))], Math.min(1, f * 1.6));
    else if (q.k === 'g') glow(q.x, q.y, q.size * (1.25 - f * .25), q.col, f);
  }
  ctx.lineCap = 'round';
  for (const q of parts) if (q.k === 's') { ctx.globalAlpha = q.life / q.max; ctx.strokeStyle = q.col; ctx.lineWidth = q.size; ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx * .035, q.y - q.vy * .035); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function drawRings() {
  for (const r of rings) { const f = r.life / r.max; ctx.globalAlpha = f; ctx.strokeStyle = r.col; ctx.lineWidth = Math.max(.5, r.w * f); ctx.beginPath(); ctx.arc(r.x, r.y, r.R * easeOutCubic(1 - f), 0, TAU); ctx.stroke(); }
  ctx.globalAlpha = 1;
}
function drawTexts(screen) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const x of texts) {
    if (!!x.screen !== screen) continue;
    const age = x.max - x.life, f = x.life / x.max, s = age < .18 ? easeOutBack(age / .18) : 1;
    ctx.save(); ctx.translate(x.x, x.y); ctx.scale(s, s); ctx.globalAlpha = Math.min(1, f * 2.5);
    ctx.font = `900 ${x.size}px ${FONT}`; ctx.lineWidth = Math.max(3, x.size / 6); ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(x.txt, 0, 0);
    ctx.fillStyle = x.col; ctx.fillText(x.txt, 0, 0); ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ================= 기체 그리기 =================
const PAL = {
  player: { wing: '#2f6bff', under: '#1a2a58', body: ['#8593a8', '#f4f8fc', '#7c889c'], tip: '#ff7a2a', glass: '#7ff0ff', flame: '#4fb8ff' },
  fighter: { wing: '#c0303f', under: '#5a1520', body: ['#8a7a7a', '#e8dada', '#776868'], tip: '#ffd34a', glass: '#ffd34a', flame: '#ff7040' },
  ace: { wing: '#d8a520', under: '#5a4508', body: ['#1e1e24', '#4a4a56', '#1a1a20'], tip: '#ff3030', glass: '#ff5050', flame: '#ff3a3a' },
};
function drawJet(x, y, a, bank, pal, alpha = 1, sc = 1, shadow = false, white = false) {
  const cs = Math.cos(bank), sn = Math.sin(bank), under = cs < 0;
  const C = c => shadow ? '#000' : white ? '#fff' : c;
  ctx.save(); ctx.translate(x, y); ctx.rotate(a + Math.PI / 2); ctx.scale(sc, sc); ctx.globalAlpha = alpha;
  ctx.save(); ctx.scale(cs, 1);
  ctx.fillStyle = C(under ? pal.under : pal.wing);
  ctx.beginPath(); ctx.moveTo(-5, -9); ctx.lineTo(-29, 8); ctx.lineTo(-29, 13); ctx.lineTo(-6, 12); ctx.lineTo(6, 12); ctx.lineTo(29, 13); ctx.lineTo(29, 8); ctx.lineTo(5, -9); ctx.closePath(); ctx.fill();

  const tx = W / 2 + (1 - easeOutCubic(inP)) * W * .9 - easeInCubic(outP) * W * .9;
  ctx.translate(tx, y); ctx.transform(1, 0, -.18, 1, 0, 0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `900 ${Math.min(68, W / 8)}px ${FONT}`; ctx.shadowColor = acc; ctx.shadowBlur = 24; ctx.fillStyle = '#fff'; ctx.fillText(b.txt, 0, -10); ctx.shadowBlur = 0;
  ctx.font = `700 17px ${KFONT}`; ctx.fillStyle = acc; ctx.fillText(b.sub, 0, 34);
  ctx.restore();
}
function drawTitle() {
  ctx.fillStyle = 'rgba(10,5,25,.3)'; ctx.fillRect(0, 0, W, H);
  const fs = Math.min(84, W / 9), y = H * .24;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const words = ['DOGFIGHT', 'ARENA'];
  words.forEach((w, wi) => {
    const k = clamp((titleT - wi * .25) / .6, 0, 1), e = easeOutBack(k), dir = wi ? 1 : -1;
    ctx.save(); ctx.globalAlpha = k; ctx.translate(W / 2 + (1 - e) * dir * W * .6, y + wi * fs * 1.0); ctx.transform(1, 0, -.15, 1, 0, 0);
    ctx.font = `900 ${wi ? fs * .8 : fs}px ${FONT}`;
    const g = ctx.createLinearGradient(0, -fs / 2, 0, fs / 2); g.addColorStop(0, '#fff2d0'); g.addColorStop(.5, wi ? '#ff7a5a' : '#ffb86a'); g.addColorStop(1, '#c0304a');
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(20,5,30,.85)'; ctx.strokeText(w, 0, 0); ctx.fillStyle = g; ctx.fillText(w, 0, 0);
    ctx.restore();
  });
  ctx.globalAlpha = clamp(titleT - .9, 0, 1);
  ctx.font = `800 ${Math.min(20, W / 20)}px ${KFONT}`; ctx.fillStyle = '#ffd0a0'; ctx.fillText('—  360° 공중전, 꼬리를 물어라  —', W / 2, y + fs * 1.75);
  const lines = [['선회 / 조준', '마우스 이동 · A D · 터치 스틱'], ['가속 / 감속', 'W · S (마우스: S 감속)'], ['부스트', 'SHIFT · BOOST 버튼'], ['록온 미사일', '클릭 · SPACE · MSL 버튼'], ['플레어 (미사일 회피)', '우클릭 · F · FLARE 버튼'], ['기관포', '적이 정면에 오면 자동 사격']];
  const pw = Math.min(440, W - 40), ph = lines.length * 25 + 22, py = H * .5;
  ctx.fillStyle = 'rgba(15,5,30,.55)'; rrect(W / 2 - pw / 2, py, pw, ph, 12); ctx.fill();
  ctx.font = `700 13px ${KFONT}`; ctx.textBaseline = 'alphabetic';
  lines.forEach(([a, b], i) => { ctx.textAlign = 'left'; ctx.fillStyle = '#ffb86a'; ctx.fillText(a, W / 2 - pw / 2 + 18, py + 26 + i * 25); ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.fillText(b, W / 2 + pw / 2 - 18, py + 26 + i * 25); });
  ctx.textAlign = 'center';
  ctx.globalAlpha = clamp(titleT - 1.2, 0, 1) * (.55 + .45 * Math.sin(t * 5));
  ctx.font = `900 ${Math.min(22, W / 20)}px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('PRESS SPACE / TAP TO START', W / 2, py + ph + 40);
  ctx.globalAlpha = 1;
  ctx.font = `700 13px ${KFONT}`; ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillText((best ? 'BEST ' + best + '   ·   ' : '') + 'M: 게임 선택 메뉴', W / 2, py + ph + 72);
}
function drawOver() {
  const k = clamp(overAnim / .6, 0, 1);
  ctx.fillStyle = `rgba(10,0,8,${.6 * k})`; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fs = Math.min(70, W / 9), y = H * .34 + (1 - easeOutBack(k)) * -80;
  ctx.font = `900 ${fs}px ${FONT}`; ctx.globalAlpha = k;
  ctx.globalCompositeOperation = 'lighter'; const gx = Math.random() < .15 ? rand(-10, 10) : rand(-2, 2);
  ctx.fillStyle = 'rgba(255,40,60,.8)'; ctx.fillText('SHOT DOWN', W / 2 + gx + 3, y); ctx.fillStyle = 'rgba(40,200,255,.8)'; ctx.fillText('SHOT DOWN', W / 2 - gx - 3, y);
  ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#fff'; ctx.fillText('SHOT DOWN', W / 2, y);
  const sk = clamp((overAnim - .5) / 1, 0, 1);
  ctx.font = `900 ${Math.min(40, W / 14)}px ${FONT}`; ctx.fillStyle = '#ffd06a'; ctx.fillText(Math.floor(score * easeOutCubic(sk)), W / 2, y + fs * 1.1);
  ctx.font = `700 15px ${KFONT}`; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillText(`WAVE ${wave}  ·  격추 ${kills}  ·  최대 연쇄 ${maxCombo}`, W / 2, y + fs * 1.1 + 44);
  if (newRecord && sk >= 1) { const s = 1 + Math.sin(t * 8) * .08; ctx.save(); ctx.translate(W / 2, y + fs * 1.1 + 80); ctx.scale(s, s); ctx.font = `900 22px ${FONT}`; ctx.fillStyle = `hsl(${(t * 200) % 360},100%,65%)`; ctx.fillText('NEW RECORD!', 0, 0); ctx.restore(); }
  if (overAnim > 1) { ctx.globalAlpha = .55 + .45 * Math.sin(t * 5); ctx.font = `900 18px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('PRESS SPACE / TAP TO RETRY', W / 2, H * .78); ctx.globalAlpha = .7; ctx.font = `700 14px ${KFONT}`; ctx.fillText('M: 게임 선택 메뉴', W / 2, H * .78 + 30); }
  ctx.globalAlpha = 1;
}
const menuBtn = document.getElementById('menuBtn');
function draw() {
  menuBtn.style.display = (state !== 'play' || paused) ? 'block' : 'none';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sx = (Math.random() * 2 - 1) * shake, sy = (Math.random() * 2 - 1) * shake;
  ctx.save(); ctx.translate(sx, sy);
  drawBG();
  ctx.save();
  const z = cam.z * (1 + zoomPunch);
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-cam.x, -cam.y);
  const oz = cam.z; cam.z = z; drawWorld(); cam.z = oz;
  ctx.restore();
  drawTopClouds();
  // 부스트 속도선
  if (player.boosting) {
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1.5; const a = player.a;
    for (let i = 0; i < 26; i++) { const x = rand(0, W), y = rand(0, H), l = rand(60, 180); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(a) * l, y - Math.sin(a) * l); ctx.stroke(); }
  }
  ctx.restore();
  drawTexts(true);
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.hypot(W, H) * .6);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,0,20,.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (hurtFlash > 0) { const hg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .25, W / 2, H / 2, Math.hypot(W, H) * .6); hg.addColorStop(0, 'rgba(255,0,30,0)'); hg.addColorStop(1, `rgba(255,0,30,${hurtFlash * .6})`); ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H); }
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash) * .85; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (state === 'play' || state === 'over') { drawIndicators(); drawHUD(); }
  drawBanner();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 48px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = `700 15px ${KFONT}`; ctx.fillText('P / ESC / 탭으로 계속  ·  M: 메뉴로', W / 2, H / 2 + 44);
  }
}

// ================= 루프 =================
let last = performance.now();
function frame(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  if (hitstop > 0) { hitstop -= rdt; }
  else if (!paused) {
    if (slowmo > 0) slowmo -= rdt;
    timeScale += ((slowmo > 0 ? .3 : 1) - timeScale) * Math.min(1, rdt * 10);
    update(rdt * timeScale, rdt);
  }
  draw();
  requestAnimationFrame(frame);
}
resize(); addEventListener('resize', resize);
initBG(); initTitle();
requestAnimationFrame(frame);
</script>
