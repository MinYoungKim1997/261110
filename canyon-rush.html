<script>
'use strict';
// ================= 유틸 =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, F = 600;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const pick = a => a[Math.floor(Math.random() * a.length)];
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInCubic = x => x * x * x;
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const FONT = "Orbitron, 'Arial Black', sans-serif";
const KFONT = "'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
const hex2 = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mixA = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

// ================= 글로우 =================
const glowCache = {};
function glowSpr(col) {

  gr.addColorStop(0, hexA(col, 1)); gr.addColorStop(.25, hexA(col, .6)); gr.addColorStop(.6, hexA(col, .15)); gr.addColorStop(1, hexA(col, 0));

function glow(x, y, r, col, a = 1) { if (a <= 0 || r <= 0) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(glowSpr(col), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; }

// ================= 사운드 =================

const sfx = {
  gun() { if (can('gun', 90)) tone(900, .04, 'square', .012, .5); },
  hit() { if (can('hit', 55)) noise(.06, .06, 4500, 1500); },
  clank() { if (can('clank', 80)) tone(1800, .05, 'triangle', .03, .6); },
  boom(s = 1) { if (can('boom', 45)) { noise(.35 + s * .25, Math.min(.5, .16 * s + .1), 1500, 60); tone(110, .3 + .2 * s, 'sine', .14 * Math.min(s, 2), .3); } },
  big() { noise(1.6, .55, 1000, 40); tone(70, 1.3, 'sine', .38, .3); },
  ring(n) { const f = 520 * Math.pow(1.06, Math.min(n, 24)); tone(f, .12, 'triangle', .07); tone(f * 1.5, .2, 'triangle', .05, 1, .06); },
  roll() { noise(.45, .14, 400, 3500); },
  boost() { noise(.7, .15, 300, 3000); tone(120, .6, 'sawtooth', .04, 3); },
  scrape() { if (can('scrape', 90)) noise(.12, .12, 6000, 2500); },
  whoosh() { noise(.6, .2, 300, 4000); },
  hurt() { noise(.3, .3, 2500, 200); tone(220, .25, 'sawtooth', .08, .4); },
  warn() { for (let i = 0; i < 3; i++) { tone(560, .25, 'square', .05, 1, i * .55); tone(400, .25, 'square', .05, 1, i * .55 + .27); } },
  sector() { tone(330, .15, 'triangle', .06); tone(495, .15, 'triangle', .06, 1, .15); tone(660, .4, 'triangle', .06, 1, .3); },

// ================= 상수 & 트랙 =================
const SEG = 180, NSEG = 50, FAR = SEG * NSEG, NEAR = 40, PLZ = 240, G = 200, WH = 1500, SECLEN = 10000;
const cxAt = d => Math.sin(d * .0003) * 480 + Math.sin(d * .00085 + 1) * 190;
const cwAt = d => 920 + Math.sin(d * .00031) * 240;
const SECTORS = [
  { name: '붉은 협곡', skyT: '#3a1e4a', skyB: '#ffb070', sun: '#fff0c0', f1: '#c98a52', f2: '#b47744', w1: '#b4623a', w2: '#9b502e', fog: '#f0a878', river: '#5ac8e8' },
  { name: '빙하 협곡', skyT: '#163563', skyB: '#cfe8ff', sun: '#ffffff', f1: '#e6f2ff', f2: '#c8dcf2', w1: '#8db4dc', w2: '#769fca', fog: '#d4eaff', river: '#4fd8ff' },
  { name: '화산 지대', skyT: '#120208', skyB: '#b03a1e', sun: '#ffa050', f1: '#40302c', f2: '#33241f', w1: '#5a322a', w2: '#47261f', fog: '#80301e', river: '#ff6a1a' },
].map(s => { const o = { name: s.name }; for (const k in s) if (k !== 'name') o[k] = hex2(s[k]); o.riverHex = s.river; return o; });
let pal = {};
function updPalette() {
  const sec = Math.floor(D / SECLEN), into = D - sec * SECLEN, a = SECTORS[sec % 3], b = SECTORS[(sec + 1) % 3];
  const k = clamp((into - (SECLEN - 1500)) / 1500, 0, 1);
  for (const key of ['skyT', 'skyB', 'sun', 'f1', 'f2', 'w1', 'w2', 'fog', 'river']) pal[key] = mixA(a[key], b[key], k);
  pal.riverHex = k < .5 ? a.riverHex : b.riverHex; pal.lava = (k < .5 ? sec % 3 : (sec + 1) % 3) === 2;
}

// ================= 상태 =================
let state = 'title', t = 0, titleT = 0, paused = false;
let timeScale = 1, slowmo = 0, hitstop = 0, shake = 0, flash = 0, flashCol = '#fff', hurtFlash = 0;
let D = 0, speed = 1500, camX = 0, camY = -100, camRoll = 0, fovK = 1;
let player, objs = [], enemies = [], pbullets = [], ebullets = [], parts = [], texts = [], fx2d = [], timers = [];
let score = 0, dispScore = 0, scorePop = 0, ringChain = 0, ringPop = 0, kills = 0, maxChain = 0, rings = 0;
let nextD = 1500, fighterT = 4, nextBossD = 7000, boss = null, curSector = 0, banner = null;
let overT = 0, overAnim = 0, best = 0, newRecord = false;
try { best = +localStorage.getItem('canyon_best') || 0; } catch (e) { }
function later(d, fn) { timers.push({ t: d, fn }); }
function popText(x, y, txt, size = 16, col = '#fff', life = .9, vy = -60) { texts.push({ x, y, txt, size, col, life, max: life, vy }); }

// ================= 입력 =================
const keys = {};
const mouse = { x: 0, y: 0, active: false };
const drag = { id: null, x: 0, y: 0, sx: 0, sy: 0, px: 0, py: 0 };
let isTouch = false, lastTap = 0;
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true; if (e.repeat) return; initAudio();
  if (['KeyA', 'KeyD', 'KeyW', 'KeyS', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) mouse.active = false;
  if (e.code === 'KeyM' && (state !== 'play' || paused)) { location.href = 'index.html'; return; }
  if (state === 'title' || (state === 'over' && overAnim > 1)) { if (e.code === 'Space' || e.code === 'Enter') startGame(); return; }
  if (state === 'play') {
    if (e.code === 'Space' || e.code === 'KeyK') doRoll();
    if (e.code === 'KeyP' || e.code === 'Escape') paused = !paused;
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play' && player.alive) paused = true; });
cv.addEventListener('contextmenu', e => { e.preventDefault(); doRoll(); });
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; if (state === 'play') mouse.active = true; }
  if (e.pointerId === drag.id) { drag.x = e.clientX; drag.y = e.clientY; }
});
cv.addEventListener('pointerdown', e => {
  initAudio(); if (e.pointerType === 'touch') isTouch = true;
  if (state === 'title' || (state === 'over' && overAnim > 1)) { startGame(); return; }
  if (state !== 'play') return;
  if (paused) { paused = false; return; }
  if (e.pointerType === 'mouse') { if (e.button === 0) doRoll(); return; }
  const now = performance.now(); if (now - lastTap < 280) doRoll(); lastTap = now;
  if (Math.hypot(e.clientX - (W - 64), e.clientY - (H - 74)) < 48) { touchBoost = e.pointerId; return; }
  drag.id = e.pointerId; drag.x = drag.sx = e.clientX; drag.y = drag.sy = e.clientY; drag.px = player.tx; drag.py = player.ty;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
});
let touchBoost = null;
const endPtr = e => { if (e.pointerId === drag.id) drag.id = null; if (e.pointerId === touchBoost) touchBoost = null; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);

// ================= 투영 =================
function proj(x, y, d) {
  const z = d - D; if (z < NEAR) return null;

}

// ================= 파티클 (3D) =================
function P(o) { if (parts.length < 1800) parts.push(o); }

function fireP(x, y, d, vx, vy, vd, size, life) { P({ k: 'f', x, y, d, vx, vy, vd, life, max: life, size, drag: 2, grow: 1.4 }); }
function smoke(x, y, d, vx, vy, size, life, col = '#4a4a50') { P({ k: 'm', x, y, d, vx, vy, vd: 0, life, max: life, size, drag: 1.5, grow: 2.2, col }); }
function flashP(x, y, d, size, col = '#ffe6a0', life = .25) { P({ k: 'g', x, y, d, vx: 0, vy: 0, vd: 0, life, max: life, size, col, drag: 0 }); }

  for (let i = 0; i < Math.round(16 * s); i++) { const a = rand(0, TAU), sp = rand(300, 1100) * q; spark(x, y, d, Math.cos(a) * sp, Math.sin(a) * sp, vd + rand(-900, 900) * q, pick(['#ffdc8a', '#ffffff', '#ffb050']), rand(.25, .6), rand(3, 6)); }
  for (let i = 0; i < Math.round(6 * s); i++) smoke(x + rand(-30, 30) * s, y + rand(-30, 30) * s, d + rand(-30, 30), rand(-80, 80), rand(-120, 0), rand(30, 60) * q, rand(.9, 1.8));
  const pp = proj(x, y, d); if (pp) fx2d.push({ x: pp.x, y: pp.y, r0: 10, R: 160 * s * clamp(pp.s * 1.5, .3, 2.5), life: .45, max: .45, w: 6 * q, col: '#ffffff' });

function updParts(dt) {

  for (let i = fx2d.length - 1; i >= 0; i--) { fx2d[i].life -= dt; if (fx2d[i].life <= 0) fx2d.splice(i, 1); }
}
const FIRECOL = ['#a02010', '#ff5a1a', '#ffb030', '#fff2b0'];
function drawParts(nearSide) {

// ================= 플레이어 =================
function newPlayer() {
  return { x: cxAt(PLZ), y: -60, vx: 0, vy: 0, tx: cxAt(PLZ), ty: -60, bank: 0, pitch: 0, hp: 100, maxHp: 100, hpLag: 100, boost: .6, boosting: false, roll: 0, rollDir: 1, rollCd: 0, inv: 0, fireCd: 0, alive: true, scrapeT: 0 };
}
const ROLL_T = .6;
function doRoll() {
  const p = player; if (state !== 'play' || !p.alive || p.rollCd > 0 || paused) return;
  const ix = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  p.rollDir = ix || (p.vx < -40 ? -1 : 1); p.roll = ROLL_T; p.rollCd = 1.1; sfx.roll();
  p.vx += p.rollDir * 500;
}
function updPlayer(dt) {
  const p = player, pd = D + PLZ, cxP = cxAt(pd), half = cwAt(pd) / 2 - 60;
  p.inv -= dt; p.rollCd -= dt; if (p.roll > 0) p.roll = Math.max(0, p.roll - dt);
  if (!p.alive) return;

  let tvx = 0, tvy = 0;

  else if (mouse.active) {

    tvx = ix * 950; tvy = iy * 750; p.tx = p.x; p.ty = p.y;

  const k = Math.min(1, dt * (p.roll > 0 ? 3 : 8)); p.vx += (tvx - p.vx) * k; p.vy += (tvy - p.vy) * k;
  p.x += p.vx * dt; p.y += p.vy * dt;
  // 벽 충돌 (긁힘)
  if (Math.abs(p.x - cxP) > half) {
    const s = Math.sign(p.x - cxP); p.x = cxP + s * half; p.vx = -s * 300;
    if (!demo) {
      p.scrapeT -= dt;
      if (p.inv <= 0 && p.roll <= 0) { p.hp -= 25 * dt * 4 * .25; hurtFlash = Math.max(hurtFlash, .3); }
      shake = Math.max(shake, 8); sfx.scrape();
      for (let i = 0; i < 4; i++) spark(p.x + s * 50, p.y + rand(-10, 10), pd, -s * rand(100, 400), rand(-300, 300), rand(-1500, -600), pick(['#ffd27a', '#ffffff']), .4, 4);
      if (p.hp <= 0) playerDie();
    }
  }
  if (p.y < -580) { p.y = -580; p.vy = 0; }
  if (p.y > G - 34) {
    p.y = G - 34; p.vy = Math.min(p.vy, -120);
    if (!demo) { if (p.inv <= 0 && p.roll <= 0) p.hp -= 6 * dt * 4; shake = Math.max(shake, 6); sfx.scrape(); for (let i = 0; i < 3; i++) spark(p.x + rand(-40, 40), G, pd, rand(-200, 200), rand(-400, -100), rand(-1500, -600), '#ffd27a', .4, 4); if (p.hp <= 0) playerDie(); }
  }
  p.bank += (clamp(p.vx / 950, -1, 1) * .85 - p.bank) * Math.min(1, dt * 7);
  p.pitch += (clamp(p.vy / 750, -1, 1) - p.pitch) * Math.min(1, dt * 7);
  // 부스트
  const wantB = !demo && (keys.ShiftLeft || keys.ShiftRight || keys.KeyL || touchBoost !== null);
  const was = p.boosting; p.boosting = wantB && p.boost > .02;
  if (p.boosting && !was) { sfx.boost(); flash = .15; flashCol = '#9fe8ff'; }
  if (p.boosting) p.boost = Math.max(0, p.boost - dt * .28); else p.boost = Math.min(1, p.boost + dt * .03);
  // 엔진 배기
  if (Math.random() < dt * 50) for (const s of [-1, 1]) fireP(p.x + s * 9, p.y + 4, pd - 20, rand(-20, 20), rand(-20, 20), speed * .55, p.boosting ? 9 : 5, .12);
  if (demo) return;

  p.fireCd -= dt;
  if (p.fireCd <= 0 && p.roll <= 0) {

    const b = { x: W - 64, y: H - 74 }; ctx.globalAlpha = p.boost > .05 ? .85 : .3; ctx.fillStyle = 'rgba(10,20,40,.5)'; ctx.strokeStyle = '#6ae0ff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, 38, 0, TAU); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#6ae0ff'; ctx.font = `900 11px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('BOOST', b.x, b.y); ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
  }
}
function drawFx2d() {
  for (const r of fx2d) {
    if (!r.R) continue; const f = r.life / r.max;
    ctx.globalAlpha = f; ctx.strokeStyle = r.col; ctx.lineWidth = Math.max(.5, r.w * f);
    ctx.beginPath(); ctx.arc(r.x, r.y, (r.r0 || 0) + r.R * easeOutCubic(1 - f), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const x of texts) {
    const age = x.max - x.life, f = x.life / x.max, s = age < .18 ? easeOutBack(age / .18) : 1;
    ctx.save(); ctx.translate(x.x, x.y); ctx.scale(s, s); ctx.globalAlpha = Math.min(1, f * 2.5);
    ctx.font = `900 ${x.size}px ${FONT}, ${KFONT}`; ctx.lineWidth = Math.max(3, x.size / 6); ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(x.txt, 0, 0);
    ctx.fillStyle = x.col; ctx.fillText(x.txt, 0, 0); ctx.restore();
  }

}
function drawBanner() {
  if (!banner) return;
  const b = banner, T = b.t, D2 = b.dur, y = H * .38, acc = b.warn ? '#ff3a4a' : '#ffd06a';
  const inP = clamp(T / .45, 0, 1), outP = clamp((T - (D2 - .4)) / .4, 0, 1), band = easeOutCubic(clamp(T / .25, 0, 1)) * (1 - easeInCubic(outP)), bh = 120 * band;
  ctx.save();
  ctx.fillStyle = b.warn ? 'rgba(110,0,15,.55)' : 'rgba(30,10,20,.45)'; ctx.fillRect(0, y - bh / 2, W, bh);
  ctx.fillStyle = acc; ctx.fillRect(0, y - bh / 2, W * easeOutCubic(inP), 2); ctx.fillRect(W * (1 - easeOutCubic(inP)), y + bh / 2 - 2, W, 2);
  const tx = W / 2 + (1 - easeOutCubic(inP)) * W * .9 - easeInCubic(outP) * W * .9;
  ctx.translate(tx, y); ctx.transform(1, 0, -.18, 1, 0, 0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (b.warn && Math.floor(T * 6) % 2) ctx.globalAlpha = .45;
  ctx.font = `900 ${Math.min(68, W / 8)}px ${FONT}`; ctx.shadowColor = acc; ctx.shadowBlur = 24; ctx.fillStyle = '#fff'; ctx.fillText(b.txt, 0, -10); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  ctx.font = `700 17px ${KFONT}`; ctx.fillStyle = acc; ctx.fillText(b.sub, 0, 34);
  ctx.restore();
}
function drawTitle() {
  ctx.fillStyle = 'rgba(20,5,20,.25)'; ctx.fillRect(0, 0, W, H);
  const fs = Math.min(84, W / 9), y = H * .22;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // 원근 줌인 타이틀
  const k = clamp(titleT / .9, 0, 1), sc = lerp(4, 1, easeOutCubic(k));
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(sc, sc); ctx.globalAlpha = k;
  ctx.font = `900 ${fs}px ${FONT}`;
  const g = ctx.createLinearGradient(0, -fs / 2, 0, fs / 2); g.addColorStop(0, '#fff4c0'); g.addColorStop(.55, '#ffb030'); g.addColorStop(1, '#d0401a');
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(30,5,20,.85)'; ctx.strokeText('CANYON', 0, -fs * .45); ctx.fillStyle = g; ctx.fillText('CANYON', 0, -fs * .45);
  ctx.font = `900 ${fs * .9}px ${FONT}`; ctx.strokeText('RUSH', 0, fs * .5); ctx.fillText('RUSH', 0, fs * .5);
  ctx.restore();
  ctx.globalAlpha = clamp(titleT - .9, 0, 1);
  ctx.font = `800 ${Math.min(20, W / 20)}px ${KFONT}`; ctx.fillStyle = '#ffe0b0'; ctx.fillText('—  협곡을 초고속으로 돌파하라  —', W / 2, y + fs * 1.35);
  const lines = [['조종', '마우스 · WASD / 방향키 · 드래그'], ['부스트', 'SHIFT 누르기 · BOOST 버튼'], ['배럴 롤 (무적)', '클릭 · SPACE · 더블탭'], ['사격', '자동 (조준선 근처 자동 유도)'], ['링 통과', '점수 연쇄 + 부스트 충전']];
  const pw = Math.min(440, W - 40), ph = lines.length * 25 + 22, py = H * .5;
  ctx.fillStyle = 'rgba(30,8,20,.55)'; rrect(W / 2 - pw / 2, py, pw, ph, 12); ctx.fill();
  ctx.font = `700 13px ${KFONT}`; ctx.textBaseline = 'alphabetic';
  lines.forEach(([a, b], i) => { ctx.textAlign = 'left'; ctx.fillStyle = '#ffd06a'; ctx.fillText(a, W / 2 - pw / 2 + 18, py + 26 + i * 25); ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.fillText(b, W / 2 + pw / 2 - 18, py + 26 + i * 25); });
  ctx.textAlign = 'center';
  ctx.globalAlpha = clamp(titleT - 1.2, 0, 1) * (.55 + .45 * Math.sin(t * 5));
  ctx.font = `900 ${Math.min(22, W / 20)}px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('PRESS SPACE / TAP TO START', W / 2, py + ph + 40);
  ctx.globalAlpha = 1;
  ctx.font = `700 13px ${KFONT}`; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText((best ? 'BEST ' + best + '   ·   ' : '') + 'M: 게임 선택 메뉴', W / 2, py + ph + 72);
}
function drawOver() {
  const k = clamp(overAnim / .6, 0, 1);
  ctx.fillStyle = `rgba(10,0,8,${.6 * k})`; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fs = Math.min(70, W / 9), y = H * .34 + (1 - easeOutBack(k)) * -80;
  ctx.font = `900 ${fs}px ${FONT}`; ctx.globalAlpha = k;
  ctx.globalCompositeOperation = 'lighter'; const gx = Math.random() < .15 ? rand(-10, 10) : rand(-2, 2);
  ctx.fillStyle = 'rgba(255,40,60,.8)'; ctx.fillText('CRASHED', W / 2 + gx + 3, y); ctx.fillStyle = 'rgba(40,200,255,.8)'; ctx.fillText('CRASHED', W / 2 - gx - 3, y);
  ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#fff'; ctx.fillText('CRASHED', W / 2, y);
  const sk = clamp((overAnim - .5) / 1, 0, 1);
  ctx.font = `900 ${Math.min(40, W / 14)}px ${FONT}`; ctx.fillStyle = '#ffd06a'; ctx.fillText(Math.floor(score * easeOutCubic(sk)), W / 2, y + fs * 1.1);
  ctx.font = `700 15px ${KFONT}`; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillText(`${Math.floor(D / 10)}m 비행  ·  격파 ${kills}  ·  링 ${rings}  ·  최대 연쇄 ${maxChain}`, W / 2, y + fs * 1.1 + 44);
  if (newRecord && sk >= 1) { const s = 1 + Math.sin(t * 8) * .08; ctx.save(); ctx.translate(W / 2, y + fs * 1.1 + 80); ctx.scale(s, s); ctx.font = `900 22px ${FONT}`; ctx.fillStyle = `hsl(${(t * 200) % 360},100%,65%)`; ctx.fillText('NEW RECORD!', 0, 0); ctx.restore(); }
  if (overAnim > 1) { ctx.globalAlpha = .55 + .45 * Math.sin(t * 5); ctx.font = `900 18px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('PRESS SPACE / TAP TO RETRY', W / 2, H * .78); ctx.globalAlpha = .7; ctx.font = `700 14px ${KFONT}`; ctx.fillText('M: 게임 선택 메뉴', W / 2, H * .78 + 30); }
  ctx.globalAlpha = 1;
}
const menuBtn = document.getElementById('menuBtn');
function draw() {
  menuBtn.style.display = (state !== 'play' || paused) ? 'block' : 'none';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  const sx = (Math.random() * 2 - 1) * shake, sy = (Math.random() * 2 - 1) * shake;
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.rotate(-camRoll); ctx.translate(-W / 2, -H / 2);
  drawSky(); drawTerrain();
  const list = [];
  for (const o of objs) list.push({ z: o.d - D, o, k: 'o' });
  for (const e of enemies) list.push({ z: e.d - D, o: e, k: 'e' });
  list.sort((a, b) => b.z - a.z);
  for (const it of list) if (it.z >= PLZ) it.k === 'o' ? drawObj(it.o) : drawEnemy(it.o);
  drawBullets();
  drawParts(false);
  drawPlayer();
  for (const it of list) if (it.z < PLZ) it.k === 'o' ? drawObj(it.o) : drawEnemy(it.o);

  drawSpeedLines();
  drawFx2d();

  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,0,10,.55)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (hurtFlash > 0) { const hg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .25, W / 2, H / 2, Math.hypot(W, H) * .6); hg.addColorStop(0, 'rgba(255,0,30,0)'); hg.addColorStop(1, `rgba(255,0,30,${hurtFlash * .6})`); ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H); }
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash) * .8; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }

    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 48px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = `700 15px ${KFONT}`; ctx.fillText('P / ESC / 탭으로 계속  ·  M: 메뉴로', W / 2, H / 2 + 44);
  }
}

// ================= 루프 =================
let last = performance.now();
function frame(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  if (hitstop > 0) hitstop -= rdt;
  else if (!paused) {
    if (slowmo > 0) slowmo -= rdt;
    timeScale += ((slowmo > 0 ? .3 : 1) - timeScale) * Math.min(1, rdt * 10);
    update(rdt * timeScale, rdt);
  }
  draw();
  requestAnimationFrame(frame);
}
resize(); addEventListener('resize', resize);
player = newPlayer(); camX = cxAt(0); updPalette();
requestAnimationFrame(frame);
</script>
