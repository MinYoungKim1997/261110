<!doctype html>
<html lang="ko">
<head>

</head>
<body>
<canvas id="c"></canvas>
<a id="menuBtn" href="index.html" style="position:fixed;left:16px;top:16px;padding:8px 14px;border-radius:10px;background:rgba(0,12,30,.6);color:#9fe8ff;font:900 12px Orbitron,sans-serif;text-decoration:none;border:1px solid rgba(159,232,255,.5);letter-spacing:1px">◀ MENU</a>
<script>
'use strict';
// ================= 기본 유틸 =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const pick = a => a[Math.floor(Math.random() * a.length)];
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInCubic = x => x * x * x;
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const FONT = "Orbitron, 'Arial Black', 'Apple SD Gothic Neo', sans-serif";
const KFONT = "'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  btn.bomb.x = W - 64; btn.bomb.y = H - 74;
  btn.roll.x = W - 64; btn.roll.y = H - 168;
}

// ================= 글로우 스프라이트 캐시 =================
const glowCache = {};
function glowSpr(col) {
  let c = glowCache[col]; if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, hexA(col, 1)); gr.addColorStop(.25, hexA(col, .6)); gr.addColorStop(.6, hexA(col, .15)); gr.addColorStop(1, hexA(col, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return glowCache[col] = c;
}
function glow(x, y, r, col, a = 1) { if (a <= 0) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(glowSpr(col), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; }

// ================= 사운드 (WebAudio 합성) =================
let AC = null, master = null, noiseBuf = null; const lastS = {};
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { }
}
function can(n, gap) { const now = performance.now(); if (lastS[n] && now - lastS[n] < gap) return false; lastS[n] = now; return true; }
function tone(f, d, type = 'square', v = .05, slide = 1, delay = 0) {
  if (!AC) return; const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + .02);
}
function noise(d, v = .2, f = 1000, f2 = 100) {
  if (!AC) return; const t0 = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const bq = AC.createBiquadFilter(); bq.type = 'lowpass'; bq.frequency.setValueAtTime(f, t0); bq.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t0 + d);
  const g = AC.createGain(); g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  s.connect(bq); bq.connect(g); g.connect(master); s.start(t0); s.stop(t0 + d);
}
const sfx = {
  shot() { if (can('shot', 95)) tone(1300, .045, 'square', .01, .45); },
  hit() { if (can('hit', 55)) noise(.06, .06, 4500, 1500); },
  boom(s = 1) { if (can('boom', 45)) { noise(.35 + s * .25, Math.min(.5, .16 * s + .1), 1500, 60); tone(110, .3 + .2 * s, 'sine', .14 * Math.min(s, 2), .3); } },
  big() { noise(1.8, .6, 1000, 40); tone(70, 1.4, 'sine', .4, .3); },
  pick() { tone(700, .08, 'square', .04, 1.5); tone(1050, .14, 'square', .04, 1.5, .07); },
  roll() { noise(.4, .14, 400, 3500); },
  missile() { if (can('mis', 120)) noise(.2, .05, 3500, 500); },
  laser() { tone(150, 1.1, 'sawtooth', .07, .5); noise(1, .1, 2500, 300); },
  warn() { for (let i = 0; i < 3; i++) { tone(560, .25, 'square', .05, 1, i * .55); tone(400, .25, 'square', .05, 1, i * .55 + .27); } },
  graze() { if (can('graze', 70)) tone(2600, .03, 'sine', .025); },
  hurt() { noise(.3, .3, 2500, 200); tone(220, .25, 'sawtooth', .08, .4); },
  bomb() { noise(1.5, .5, 2500, 50); tone(55, 1.3, 'sine', .45, .5); },
  wave() { tone(440, .12, 'triangle', .06, 1); tone(660, .12, 'triangle', .06, 1, .12); tone(880, .3, 'triangle', .06, 1, .24); },
};

// ================= 상태 =================
let state = 'title', t = 0, titleT = 0, paused = false;
let timeScale = 1, slowmo = 0, hitstop = 0, shake = 0, flash = 0, flashCol = '#ffffff', hurtFlash = 0, zoomPunch = 0;
let camX = 0, camRot = 0, scrollMul = 1, SCROLL = 240;
let player, bullets = [], ebullets = [], enemies = [], parts = [], rings = [], texts = [], pickups = [], missiles = [], timers = [];
let score = 0, dispScore = 0, scorePop = 0, combo = 0, maxCombo = 0, comboT = 0, comboPop = 0, wave = 0, waveActive = false, bossLevel = 0, boss = null;
let banner = null, bombCd = 0, overT = 0, overAnim = 0, best = 0, newRecord = false, grazes = 0, bossBarT = 0;
const TINTS = [[0, 0, 0, 0], [255, 105, 40, .2], [8, 12, 55, .5]];
let tint = [0, 0, 0, 0], tintTarget = TINTS[0];
try { best = +localStorage.getItem('skystriker_best') || 0; } catch (e) { }
const ROLL_T = .55;

function later(d, fn) { timers.push({ t: d, fn }); }
function popText(x, y, txt, size = 16, col = '#fff', life = .9, vy = -60) { texts.push({ x, y, txt, size, col, life, max: life, vy }); }

// ================= 입력 =================
const keys = {};
const drag = { id: null, x: 0, y: 0, ox: 0, oy: 0 };
const btn = { bomb: { x: 0, y: 0, r: 38 }, roll: { x: 0, y: 0, r: 32 } };
let lastTap = 0, isTouch = false;

addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true; if (e.repeat) return;
  initAudio();
  if (e.code === 'KeyM' && (state !== 'play' || paused)) { location.href = 'index.html'; return; }
  if (state === 'title' || (state === 'over' && overAnim > 1)) { if (e.code === 'Space' || e.code === 'Enter') startGame(); return; }
  if (state === 'play') {
    if (['Space', 'ShiftLeft', 'ShiftRight', 'KeyK'].includes(e.code)) doRoll();
    if (['KeyX', 'KeyB', 'KeyL'].includes(e.code)) useBomb();
    if (e.code === 'KeyP' || e.code === 'Escape') paused = !paused;
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play' && player.alive) paused = true; });
cv.addEventListener('contextmenu', e => { e.preventDefault(); useBomb(); });
cv.addEventListener('pointerdown', e => {
  initAudio(); if (e.pointerType === 'touch') isTouch = true;
  if (state === 'title' || (state === 'over' && overAnim > 1)) { startGame(); return; }
  if (state !== 'play') return;
  if (paused) { paused = false; return; }
  if (e.button === 2) return;
  if (isTouch) {
    for (const k of ['bomb', 'roll']) {
      const b = btn[k]; if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r + 12) { k === 'bomb' ? useBomb() : doRoll(); return; }
    }
  }
  const now = performance.now(); if (now - lastTap < 280) doRoll(); lastTap = now;
  drag.id = e.pointerId; drag.x = e.clientX; drag.y = e.clientY; drag.ox = player.x - e.clientX; drag.oy = player.y - e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
});
cv.addEventListener('pointermove', e => { if (e.pointerId === drag.id) { drag.x = e.clientX; drag.y = e.clientY; } });
const endPtr = e => { if (e.pointerId === drag.id) drag.id = null; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);

// ================= 배경 (바다, 섬, 구름) =================
let islandSprs = [], cloudSprs = [], islands = [], lowClouds = [], highClouds = [], glints = [], speedLines = [];
function makeIsland(size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), cx = size / 2, R = size * .3;
  const seed = [[2, rand(0, TAU), .16], [3, rand(0, TAU), .11], [5, rand(0, TAU), .06], [9, rand(0, TAU), .03]];
  const blob = r => {
    g.beginPath();
    for (let i = 0; i <= 72; i++) {
      const a = i / 72 * TAU; let k = 1; for (const [f, ph, am] of seed) k += Math.sin(a * f + ph) * am;
      const x = cx + Math.cos(a) * r * k, y = cx + Math.sin(a) * r * k; i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath();
  };
  g.shadowColor = 'rgba(110,240,230,.9)'; g.shadowBlur = size * .09;
  g.fillStyle = 'rgba(80,205,205,.5)'; blob(R * 1.16); g.fill(); g.shadowBlur = 0;
  g.fillStyle = '#ead9a2'; blob(R); g.fill();
  const gr = g.createRadialGradient(cx - R * .2, cx - R * .2, 0, cx, cx, R);
  gr.addColorStop(0, '#6fb85a'); gr.addColorStop(1, '#3f8a3e'); g.fillStyle = gr; blob(R * .86); g.fill();
  for (let i = 0; i < 55; i++) {
    const a = rand(0, TAU), d = Math.sqrt(Math.random()) * R * .68;
    g.fillStyle = pick(['#2f6f30', '#3d8a3b', '#5aa850', '#286028']);
    g.beginPath(); g.arc(cx + Math.cos(a) * d, cx + Math.sin(a) * d, rand(3, 10) * size / 300, 0, TAU); g.fill();
  }
  const peak = g.createRadialGradient(cx, cx, 0, cx, cx, R * .4);
  peak.addColorStop(0, 'rgba(140,120,90,.7)'); peak.addColorStop(1, 'rgba(140,120,90,0)'); g.fillStyle = peak; g.fillRect(0, 0, size, size);
  for (let i = 0; i < 6; i++) { g.fillStyle = pick(['#f2f2f2', '#d96b4a', '#e0c070']); g.fillRect(cx + rand(-R * .6, R * .6), cx + rand(-R * .6, R * .6), 5, 4); }
  return c;
}
function makeCloud(w) {
  const h = Math.round(w * .62), mk = (col) => {
    const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
    for (let i = 0; i < 16; i++) {
      const x = rand(.22, .78) * w, y = rand(.32, .68) * h, r = rand(.12, .22) * w;
      const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col(.95)); gr.addColorStop(.6, col(.5)); gr.addColorStop(1, col(0));
      g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    return c;
  };
  const seedState = Math.random();
  return { white: mk(a => `rgba(255,255,255,${a})`), dark: mk(a => `rgba(0,20,40,${a})`), w, h, seedState };
}
function newIsland(y) { const s = pick(islandSprs); return { s, x: rand(-100, W + 100) - s.width / 2, y: y !== undefined ? y : -s.height - rand(0, 500) }; }
function newCloud(y, sp, sc) { const c = pick(cloudSprs); return { c, x: rand(-150, W + 150) - c.w * sc / 2, y, sp, sc }; }
function initBG() {
  islandSprs = Array.from({ length: 5 }, () => makeIsland(ri(220, 380)));
  cloudSprs = Array.from({ length: 5 }, () => makeCloud(ri(260, 400)));
  islands = []; for (let i = 0; i < 4; i++) islands.push(newIsland(rand(-400, H)));
  lowClouds = []; for (let i = 0; i < 6; i++) lowClouds.push(newCloud(rand(-300, H), .85, rand(.8, 1.3)));
  highClouds = []; for (let i = 0; i < 2; i++) highClouds.push(newCloud(rand(-1600, -400), 2.1, rand(2, 2.8)));
  glints = Array.from({ length: 110 }, () => ({ x: rand(-80, W + 80), y: rand(0, H), l: rand(4, 14), ph: rand(0, TAU) }));
  speedLines = Array.from({ length: 28 }, () => ({ x: rand(0, W), y: rand(0, H), l: rand(40, 140), s: rand(.8, 1.6) }));
}
function updBG(dt) {
  for (const i of islands) { i.y += SCROLL * .35 * dt; }
  for (let k = 0; k < islands.length; k++) if (islands[k].y > H + 80) islands[k] = newIsland();
  for (const g of glints) { g.y += SCROLL * .35 * dt; if (g.y > H + 10) { g.y = -10; g.x = rand(-80, W + 80); } }
  for (let k = 0; k < lowClouds.length; k++) { const c = lowClouds[k]; c.y += SCROLL * c.sp * dt; if (c.y > H + 120) lowClouds[k] = newCloud(-c.c.h * c.sc - rand(0, 300), .85, rand(.8, 1.3)); }
  for (let k = 0; k < highClouds.length; k++) { const c = highClouds[k]; c.y += SCROLL * c.sp * dt; if (c.y > H + 60) highClouds[k] = newCloud(-c.c.h * 2.8 - rand(300, 2200), 2.1, rand(2, 2.8)); }
  for (const s of speedLines) { s.y += SCROLL * 3.2 * s.s * dt * scrollMul; if (s.y > H + s.l) { s.y = -s.l; s.x = rand(0, W); } }
  for (let i = 0; i < 4; i++) tint[i] += (tintTarget[i] - tint[i]) * Math.min(1, dt * .6);
}
function drawBG() {
  const sea = ctx.createLinearGradient(0, 0, 0, H);
  sea.addColorStop(0, '#0a4673'); sea.addColorStop(.5, '#0f5f92'); sea.addColorStop(1, '#1a7fb3');
  ctx.fillStyle = sea; ctx.fillRect(-100, -100, W + 200, H + 200);
  ctx.save(); ctx.translate(camX * .4, 0);
  ctx.strokeStyle = '#d8f4ff'; ctx.lineWidth = 1.5;
  for (const g of glints) {
    ctx.globalAlpha = .1 + .12 * Math.sin(t * 2.2 + g.ph);
    ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.lineTo(g.x + g.l, g.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const i of islands) ctx.drawImage(i.s, i.x, i.y);
  ctx.restore();
  ctx.save(); ctx.translate(camX * .8, 0);
  for (const c of lowClouds) { ctx.globalAlpha = .16; ctx.drawImage(c.c.dark, c.x + 70, c.y + 110, c.c.w * c.sc, c.c.h * c.sc); }
  for (const c of lowClouds) { ctx.globalAlpha = .55; ctx.drawImage(c.c.white, c.x, c.y, c.c.w * c.sc, c.c.h * c.sc); }
  ctx.globalAlpha = 1; ctx.restore();
  if (tint[3] > .01) { ctx.fillStyle = `rgba(${tint[0] | 0},${tint[1] | 0},${tint[2] | 0},${tint[3]})`; ctx.fillRect(-100, -100, W + 200, H + 200); }
  // 속도선
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
  const sa = .05 + (scrollMul - 1) * .25;
  for (const s of speedLines) { ctx.globalAlpha = sa * s.s; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y + s.l * scrollMul); ctx.stroke(); }
  ctx.globalAlpha = 1;
}
function drawHighClouds() {
  ctx.save(); ctx.translate(camX * 1.6, 0);
  for (const c of highClouds) { ctx.globalAlpha = .42; ctx.drawImage(c.c.white, c.x, c.y, c.c.w * c.sc, c.c.h * c.sc); }
  ctx.globalAlpha = 1; ctx.restore();
}

// ================= 파티클 =================
function P(o) { if (parts.length < 2200) parts.push(o); }
function spark(x, y, a, s, col = '#ffd27a', life = .4, size = 2) { P({ k: 's', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, size, col, drag: 3 }); }
function fireP(x, y, vx, vy, size, life) { P({ k: 'f', x, y, vx, vy, life, max: life, size, drag: 2.2, grow: 1.4 }); }
function smoke(x, y, vx, vy, size, life, col = '#4a4a50') { P({ k: 'm', x, y, vx, vy, life, max: life, size, drag: 1.5, grow: 2.2, col }); }
function debris(x, y, s = 1) { const a = rand(0, TAU), sp = rand(150, 480) * s; const l = rand(.6, 1.3); P({ k: 'd', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: l, max: l, size: rand(3, 7), rot: rand(0, TAU), vr: rand(-15, 15), drag: 1.2 }); }
function flashP(x, y, size, col = '#ffe6a0', life = .25) { P({ k: 'g', x, y, vx: 0, vy: 0, life, max: life, size, col, drag: 0 }); }
function explode(x, y, s = 1) {
  const q = Math.sqrt(s);
  flashP(x, y, 90 * s);
  for (let i = 0; i < Math.round(10 * s); i++) { const a = rand(0, TAU), sp = rand(20, 230) * q; fireP(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(10, 22) * q, rand(.35, .85)); }
  for (let i = 0; i < Math.round(14 * s); i++) spark(x, y, rand(0, TAU), rand(200, 750) * q, pick(['#ffdc8a', '#ffffff', '#ffb050']), rand(.2, .55), rand(1.5, 3));
  for (let i = 0; i < Math.round(6 * s); i++) smoke(x + rand(-10, 10) * s, y + rand(-10, 10) * s, rand(-60, 60), rand(-60, 60), rand(12, 24) * q, rand(.8, 1.7));
  for (let i = 0; i < Math.round(3 * s); i++) debris(x, y, q);
  rings.push({ x, y, life: .45, max: .45, R: 110 * s, w: 6 * q, col: '#ffffff' });
  shake = Math.max(shake, 4 * s); sfx.boom(s);
}
function updParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life -= dt;
    if (q.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    const dr = Math.max(0, 1 - q.drag * dt); q.vx *= dr; q.vy *= dr;
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.k === 'm' || q.k === 'd' || q.k === 'f') q.y += SCROLL * .35 * dt;
    if (q.k === 'd') { q.rot += q.vr * dt; if (Math.random() < dt * 35) { smoke(q.x, q.y, 0, 0, 4, .5); fireP(q.x, q.y, 0, 0, 5, .2); } }
  }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].life -= dt; if (rings[i].life <= 0) rings.splice(i, 1); }
  for (let i = texts.length - 1; i >= 0; i--) { const x = texts[i]; x.life -= dt; x.y += x.vy * dt; x.vy *= Math.max(0, 1 - 2 * dt); if (x.life <= 0) texts.splice(i, 1); }
}
const FIRECOL = ['#a02010', '#ff5a1a', '#ffb030', '#fff2b0'];
function drawParts() {
  for (const q of parts) if (q.k === 'm') { const f = q.life / q.max; glow(q.x, q.y, q.size * (1 + (1 - f) * q.grow) * 1.4, q.col, f * .6); }
  ctx.fillStyle = '#2a2622';
  for (const q of parts) if (q.k === 'd') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillRect(-q.size / 2, -q.size / 3, q.size, q.size * .66); ctx.restore(); }
  ctx.globalCompositeOperation = 'lighter';
  for (const q of parts) {
    const f = q.life / q.max;
    if (q.k === 'f') glow(q.x, q.y, q.size * (1 + (1 - f) * q.grow), FIRECOL[Math.min(3, Math.floor(f * 4))], Math.min(1, f * 1.6));
    else if (q.k === 'g') glow(q.x, q.y, q.size * (1.25 - f * .25), q.col, f);
  }
  ctx.lineCap = 'round';
  for (const q of parts) if (q.k === 's') {
    ctx.globalAlpha = q.life / q.max; ctx.strokeStyle = q.col; ctx.lineWidth = q.size;
    ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx * .035, q.y - q.vy * .035); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

const menuBtn = document.getElementById('menuBtn');
function draw() {
  menuBtn.style.display = (state !== 'play' || paused) ? 'block' : 'none';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawWorld();
  // 비네트
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.hypot(W, H) * .6);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (hurtFlash > 0) {
    const hg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .25, W / 2, H / 2, Math.hypot(W, H) * .6);
    hg.addColorStop(0, 'rgba(255,0,30,0)'); hg.addColorStop(1, `rgba(255,0,30,${hurtFlash * .6})`); ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);
  }
  if (state === 'play' && player.alive && player.hp / player.maxHp < .3) {
    const a = (.5 + .5 * Math.sin(t * 6)) * .25; ctx.strokeStyle = `rgba(255,30,50,${a})`; ctx.lineWidth = 16; ctx.strokeRect(0, 0, W, H);
  }
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash) * .85; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (state === 'play' || state === 'over') drawHUD();
  drawBanner();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 48px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = `700 15px ${KFONT}`; ctx.fillText('P / ESC / 탭으로 계속  ·  M: 메뉴로', W / 2, H / 2 + 44);
  }
}

// ================= 루프 =================
let last = performance.now();
function frame(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  if (hitstop > 0) { hitstop -= rdt; shake *= .95; }
  else if (!paused) {
    if (slowmo > 0) slowmo -= rdt;
    timeScale += ((slowmo > 0 ? .28 : 1) - timeScale) * Math.min(1, rdt * 10);
    update(rdt * timeScale, rdt);
  }
  draw();
  requestAnimationFrame(frame);
}
resize(); addEventListener('resize', () => { resize(); });
initBG();
player = newPlayer();
requestAnimationFrame(frame);
</script>
